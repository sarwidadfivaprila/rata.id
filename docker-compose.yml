services:
  auth-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${AUTH_DB_USER}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rata-network

  schedule-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SCHEDULE_DB_USER}
      POSTGRES_PASSWORD: ${SCHEDULE_DB_PASSWORD}
      POSTGRES_DB: ${SCHEDULE_DB_NAME}
    volumes:
      - schedule-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SCHEDULE_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rata-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - rata-network

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@auth-postgres:5432/${AUTH_DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PORT: 3001
    depends_on:
      auth-postgres:
        condition: service_healthy
    networks:
      - rata-network

  schedule-service:
    build: ./schedule-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://${SCHEDULE_DB_USER}:${SCHEDULE_DB_PASSWORD}@schedule-postgres:5432/${SCHEDULE_DB_NAME}?schema=public
      AUTH_SERVICE_URL: http://auth-service:3001/graphql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3002
    depends_on:
      schedule-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - rata-network

networks:
  rata-network:
    driver: bridge

volumes:
  auth-postgres-data:
  schedule-postgres-data:
